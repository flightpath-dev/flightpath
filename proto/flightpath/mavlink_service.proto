syntax = "proto3";

package flightpath;

import "flightpath/extended_sys_state.proto";
import "flightpath/global_position_int.proto";
import "flightpath/gps_raw_int.proto";
import "flightpath/heartbeat.proto";
import "flightpath/radio_status.proto";
import "flightpath/statustext.proto";
import "flightpath/sys_status.proto";
import "flightpath/vfr_hud.proto";

// MAVLinkService handles all MAVLink messages
service MAVLinkService {
  // Subscribe to all MAVLink messages (or a filtered subset)
  rpc SubscribeMessages(SubscribeMessagesRequest) returns (stream SubscribeMessagesResponse);
}

// MavlinkMessageType identifies the type of MAVLink message
enum MavlinkMessageType {
  MAVLINK_MESSAGE_TYPE_UNSPECIFIED = 0;
  MAVLINK_MESSAGE_TYPE_HEARTBEAT = 1;
  MAVLINK_MESSAGE_TYPE_SYS_STATUS = 2;
  MAVLINK_MESSAGE_TYPE_GPS_RAW_INT = 3;
  MAVLINK_MESSAGE_TYPE_GLOBAL_POSITION_INT = 4;
  MAVLINK_MESSAGE_TYPE_VFR_HUD = 5;
  MAVLINK_MESSAGE_TYPE_RADIO_STATUS = 6;
  MAVLINK_MESSAGE_TYPE_EXTENDED_SYS_STATE = 7;
  MAVLINK_MESSAGE_TYPE_STATUSTEXT = 8;
}

// Subscribe to all messages or a filtered subset
message SubscribeMessagesRequest {
  // Optional: if empty, subscribe to all message types
  // If specified, only these message types will be sent
  repeated MavlinkMessageType message_types = 1;
}

// Contains any MAVLink message type specified by message_type
message SubscribeMessagesResponse {
  // Timestamp when this message was captured (milliseconds since Unix epoch)
  int64 timestamp_ms = 1;

  // System ID of the component sending the message
  uint32 system_id = 2;

  // Component ID of the component sending the message
  uint32 component_id = 3;

  // Message type identifier
  MavlinkMessageType message_type = 4;

  // The actual message data - only one field will be set
  oneof message {
    Heartbeat heartbeat = 5;
    SysStatus sys_status = 6;
    GpsRawInt gps_raw_int = 7;
    GlobalPositionInt global_position_int = 8;
    VfrHud vfr_hud = 9;
    RadioStatus radio_status = 10;
    ExtendedSysState extended_sys_state = 11;
    StatusText status_text = 12;
  }
}
