syntax = "proto3";

package flightpath;

import "flightpath/extended_sys_state.proto";
import "flightpath/global_position_int.proto";
import "flightpath/gps_raw_int.proto";
import "flightpath/heartbeat.proto";
import "flightpath/mavlink_commands.proto";
import "flightpath/mission_current.proto";
import "flightpath/mission_item_reached.proto";
import "flightpath/radio_status.proto";
import "flightpath/statustext.proto";
import "flightpath/sys_status.proto";
import "flightpath/vfr_hud.proto";

// MAVLinkService handles commands and messages from the gRPC clients
service MAVLinkService {
  // Subscribe to all MAVLink messages (or a filtered subset)
  rpc SubscribeMessages(SubscribeMessagesRequest) returns (stream SubscribeMessagesResponse);

  // Send a MAVLink COMMAND_LONG (76) message to the drone
  // All parameters are floats
  rpc SendCommandLong(SendCommandLongRequest) returns (SendCommandLongResponse);

  // Send a MAVLink COMMAND_INT (75) message to the drone
  // Parameters 5 and 6 (x, y) are int32 for higher precision (e.g., lat/lon)
  rpc SendCommandInt(SendCommandIntRequest) returns (SendCommandIntResponse);
}

// MavlinkMessageType identifies the type of MAVLink message
enum MavlinkMessageType {
  MAVLINK_MESSAGE_TYPE_UNSPECIFIED = 0;
  MAVLINK_MESSAGE_TYPE_HEARTBEAT = 1;
  MAVLINK_MESSAGE_TYPE_SYS_STATUS = 2;
  MAVLINK_MESSAGE_TYPE_GPS_RAW_INT = 3;
  MAVLINK_MESSAGE_TYPE_GLOBAL_POSITION_INT = 4;
  MAVLINK_MESSAGE_TYPE_VFR_HUD = 5;
  MAVLINK_MESSAGE_TYPE_RADIO_STATUS = 6;
  MAVLINK_MESSAGE_TYPE_EXTENDED_SYS_STATE = 7;
  MAVLINK_MESSAGE_TYPE_STATUSTEXT = 8;
  MAVLINK_MESSAGE_TYPE_MISSION_CURRENT = 9;
  MAVLINK_MESSAGE_TYPE_MISSION_ITEM_REACHED = 10;
}

// Subscribe to all messages or a filtered subset
message SubscribeMessagesRequest {
  // Optional: if empty, subscribe to all message types
  // If specified, only these message types will be sent
  repeated MavlinkMessageType message_types = 1;
}

// Contains any MAVLink message type specified by message_type
message SubscribeMessagesResponse {
  // Timestamp when this message was captured (milliseconds since Unix epoch)
  int64 timestamp_ms = 1;

  // System ID of the component sending the message
  uint32 system_id = 2;

  // Component ID of the component sending the message
  uint32 component_id = 3;

  // Message type identifier
  MavlinkMessageType message_type = 4;

  // The actual message data - only one field will be set
  oneof message {
    Heartbeat heartbeat = 5;
    SysStatus sys_status = 6;
    GpsRawInt gps_raw_int = 7;
    GlobalPositionInt global_position_int = 8;
    VfrHud vfr_hud = 9;
    RadioStatus radio_status = 10;
    ExtendedSysState extended_sys_state = 11;
    StatusText status_text = 12;
    MissionCurrent mission_current = 13;
    MissionItemReached mission_item_reached = 14;
  }
}

// Send a MAVLink COMMAND_LONG (76) message to the drone
// All parameters are floats
message SendCommandLongRequest {
  // Target system ID (typically 1 for autopilot)
  uint32 target_system_id = 1;

  // Target component ID (typically 1 for autopilot)
  uint32 target_component_id = 2;

  // MAV_CMD enum value (e.g., 22 for MAV_CMD_NAV_TAKEOFF, 20 for MAV_CMD_NAV_RETURN_TO_LAUNCH)
  uint32 command = 3;

  // Command parameters (param1 through param7, all floats)
  float param1 = 4;
  float param2 = 5;
  float param3 = 6;
  float param4 = 7;
  float param5 = 8;
  float param6 = 9;
  float param7 = 10;
}

// Response to a SendCommandLong request
message SendCommandLongResponse {
  // Whether the command was sent successfully
  bool success = 1;

  // Error message if the command failed (optional)
  string error_message = 2;
}

// Send a MAVLink COMMAND_INT (75) message to the drone
// Parameters 5 and 6 (x, y) are int32 for higher precision (e.g., lat/lon scaled by 1E7)
message SendCommandIntRequest {
  // Target system ID (typically 1 for autopilot)
  uint32 target_system_id = 1;

  // Target component ID (typically 1 for autopilot)
  uint32 target_component_id = 2;

  // MAV_FRAME enum value specifying the coordinate frame
  MavFrame frame = 3;

  // MAV_CMD enum value (e.g., 16 for MAV_CMD_NAV_WAYPOINT)
  uint32 command = 4;

  // Command parameters (param1 through param4 are floats)
  float param1 = 5;
  float param2 = 6;
  float param3 = 7;
  float param4 = 8;

  // Parameter 5 (x): int32 for latitude (degrees * 1E7) or local x (m * 1E4)
  int32 x = 9;

  // Parameter 6 (y): int32 for longitude (degrees * 1E7) or local y (m * 1E4)
  int32 y = 10;

  // Parameter 7 (z): float for altitude (MSL) in meters
  float z = 11;
}

// Response to a SendCommandInt request
message SendCommandIntResponse {
  // Whether the command was sent successfully
  bool success = 1;

  // Error message if the command failed (optional)
  string error_message = 2;
}
