syntax = "proto3";

package flightpath;

// Request and response messages for SubscribeStatusText
message SubscribeStatusTextRequest {}

message SubscribeStatusTextResponse {
  // Timestamp when this status text data was captured (milliseconds since Unix epoch)
  int64 timestamp_ms = 1;

  // System ID of the component sending the status text
  uint32 system_id = 2;

  // Component ID of the component sending the status text
  uint32 component_id = 3;

  // STATUSTEXT message data
  StatusText status_text = 4;
}

// StatusText represents the STATUSTEXT (253) MAVLink message
// Status text message. These messages should be kept minimal and kept only for very important status and error messages.
// The id and chunk_seq fields are used for reassembling long messages split across multiple packets.
message StatusText {
  // Severity of status message
  MavSeverity severity = 1;

  // Status text message, without null termination character
  string text = 2;
}

// MavSeverity represents severity levels from MAVLink MAV_SEVERITY enum
// All values are incremented by 1 to accommodate MAV_SEVERITY_UNSPECIFIED at 0.
// MAVLink 0 (EMERGENCY) maps to proto 1 (EMERGENCY), MAVLink 1 (ALERT) maps to proto 2, etc.
enum MavSeverity {
  MAV_SEVERITY_UNSPECIFIED = 0;
  MAV_SEVERITY_EMERGENCY = 1; // MAVLink 0: System is unusable. This is a "panic" condition.
  MAV_SEVERITY_ALERT = 2; // MAVLink 1: Action should be taken immediately. Indicates error in non-critical systems.
  MAV_SEVERITY_CRITICAL = 3; // MAVLink 2: Action must be taken immediately. Indicates failure in a primary system.
  MAV_SEVERITY_ERROR = 4; // MAVLink 3: Indicates an error in secondary/redundant systems.
  MAV_SEVERITY_WARNING = 5; // MAVLink 4: Indicates about a possible future error if not resolved within a given timeframe.
  MAV_SEVERITY_NOTICE = 6; // MAVLink 5: An unusual event has occurred, though not an error condition.
  MAV_SEVERITY_INFO = 7; // MAVLink 6: Normal operational messages. Useful for logging.
  MAV_SEVERITY_DEBUG = 8; // MAVLink 7: Debug-level messages.
}
